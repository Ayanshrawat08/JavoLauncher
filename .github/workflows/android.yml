Name: Android CI

on:
  pull_request:
    branches-ignore: [ 'l10n_v3_openjdk' ]
    types: [ opened, reopened ]
  push:
    branches-ignore: [ 'l10n_v3_openjdk' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60 # 🚀 Improvement 4: Prevents runaway costs/stuck runners
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # 🚀 Improvement 1: Using v4 for better stability and caching
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle' # Built-in caching for setup-java v4

      # --- JRE Fetching (With Failure Protection) ---
      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
          if_no_artifact_found: warn

      - name: Get JRE 17 & 21
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-new
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre17-pojav
          if_no_artifact_found: warn

      # --- Build Process ---
      - name: Build and Package
        run: |
          set -e # 🚀 Improvement 2: Shell safety
          ./scripts/languagelist_updater.sh
          mkdir -p out

          # Clean and Build Standard Version (With Runtimes)
          ./gradlew clean :app_pojavlauncher:assembleDebug --no-daemon
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

          # Build Google Play AAB (Only on specific branch/owner)
          if [ "${{ github.repository_owner }}" == "PojavLauncherTeam" ] && [ "${{ github.ref_name }}" == "v3_openjdk" ]; then
            ./gradlew :app_pojavlauncher:bundleGplay --no-daemon
            mv app_pojavlauncher/build/outputs/bundle/gplay/app_pojavlauncher-gplay.aab out/app-gplay.aab
          fi

          # 🚀 Fix 3: Safe "No-Runtime" Build (Move & Restore)
          mkdir -p temp_jre_backup
          mv app_pojavlauncher/src/main/assets/components/jre* temp_jre_backup/ || true
          
          # Re-run build without assets
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug-noruntime.apk
          
          # Restore the environment
          mv temp_jre_backup/* app_pojavlauncher/src/main/assets/components/ || true
          rm -rf temp_jre_backup

      - name: Generate MD5 Checksums
        run: |
          cd out
          md5sum app-debug.apk > app-debug.md5
          md5sum app-debug-noruntime.apk > app-debug-noruntime.md5

      # --- Final Delivery ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-Final-Builds
          path: out/

      - name: Deploy to Play Store (Internal Track)
        continue-on-error: true
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.GPLAY_SERVICE_JSON }}
          packageName: net.kdt.pojavlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
