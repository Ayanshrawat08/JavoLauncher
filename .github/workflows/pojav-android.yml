name: Android CI

on:
  push:
    branches: [ "v3_openjdk" ]
  pull_request:
    branches: [ "v3_openjdk" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      # -----------------------------
      # Checkout Repository
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # -----------------------------
      # Setup Java (Required: Android Gradle Plugin needs Java 17+)
      # -----------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      # -----------------------------
      # Grant Gradle Permission
      # -----------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # -----------------------------
      # Clean + Build Debug APK
      # -----------------------------
      - name: Build Debug APK
        run: |
          ./gradlew clean assembleDebug --no-daemon

      # -----------------------------
      # Build Google Play AAB (Only On Main Branch)
      # -----------------------------
      - name: Build Google Play AAB
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        run: |
          ./gradlew bundleGplay --no-daemon

      # -----------------------------
      # Upload APK Artifact
      # -----------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk

      # -----------------------------
      # Upload AAB Artifact
      # -----------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app_pojavlauncher/build/outputs/bundle/gplay/*.aab
